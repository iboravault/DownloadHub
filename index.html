<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameVault — Catalogue de jeux</title>
<meta name="description" content="GameVault, votre bibliothèque de jeux téléchargeables.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<!-- Barre de progression du scroll -->
<div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

<!-- Fond animé discret -->
<div class="ambient-bg" aria-hidden="true">
  <span class="orb orb-1"></span>
  <span class="orb orb-2"></span>
  <span class="orb orb-3"></span>
</div>

<a class="skip-link" href="#mainContent">Aller au contenu principal</a>

<!-- ===================== SIDEBAR ===================== -->
<aside class="sidebar" id="sidebar" aria-label="Navigation principale">
  <div class="sidebar-brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="28" height="28"><path d="M6 11h20l3 14H3L6 11z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="18" r="1.6" fill="currentColor"/><circle cx="12" cy="22" r="1.6" fill="currentColor"/><circle cx="10" cy="20" r="1.6" fill="currentColor"/><circle cx="14" cy="20" r="1.6" fill="currentColor"/><circle cx="22" cy="19" r="1.8" fill="currentColor"/><circle cx="25" cy="17" r="1.8" fill="currentColor"/></svg>
    </span>
    <span class="brand-name">GameVault</span>
  </div>

  <nav class="sidebar-nav" id="sidebarNav">
    <button class="nav-item" data-route="home" aria-current="page">
      <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v9.5a1 1 0 0 0 1 1H17.5a1 1 0 0 0 1-1V10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Accueil</span>
    </button>
    <button class="nav-item" data-route="solo">
      <svg class="nav-icon" viewBox="0 0 24 24"><rect x="2.5" y="7" width="19" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7.5 10.5v4M5.5 12.5h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="16.2" cy="11" r="1.1" fill="currentColor"/><circle cx="18.5" cy="13.3" r="1.1" fill="currentColor"/></svg>
      <span>Solo</span>
    </button>
    <button class="nav-item" data-route="multi">
      <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="8.5" cy="8.5" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="16.5" cy="9.5" r="2.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 19c.6-3.4 2.8-5 5.5-5s4.9 1.6 5.5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M14.7 14.5c2.3.2 3.9 1.7 4.3 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Multijoueur</span>
    </button>
    <button class="nav-item" data-route="new">
      <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 3.5 14.5 9.5 21 10.3 16.2 14.5 17.6 21 12 17.6 6.4 21 7.8 14.5 3 10.3 9.5 9.5 12 3.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span>Nouveautés</span>
    </button>
    <button class="nav-item" data-route="favorites">
      <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 20.2s-7.6-4.6-9.9-9C.6 7.9 2.2 4.5 5.4 4c2.1-.3 4 .8 5.1 2.6.4.7.5.7.9 0C12.5 4.8 14.4 3.7 16.5 4c3.2.5 4.8 3.9 3.3 7.2-2.3 4.4-9.9 9-9.9 9Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>Favoris</span>
    </button>
    <button class="nav-item" data-route="credits">
      <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5v.01M12 11v5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Crédits</span>
    </button>
    <button class="nav-item" data-route="settings">
      <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.5-2-3.4-2.3.9a7.6 7.6 0 0 0-2.6-1.5L14 2.5h-4l-.5 2.5a7.6 7.6 0 0 0-2.6 1.5l-2.3-.9-2 3.4 2 1.5a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.3-.9c.8.7 1.7 1.2 2.6 1.5l.5 2.5h4l.5-2.5c.9-.3 1.8-.8 2.6-1.5l2.3.9 2-3.4-2-1.6Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span>Paramètres</span>
    </button>
  </nav>

  <div class="sidebar-footer">
    <div class="game-count" id="sidebarGameCount">— jeux</div>
  </div>
</aside>

<button class="sidebar-toggle" id="sidebarToggle" aria-label="Ouvrir le menu" aria-expanded="false">
  <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
</button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- ===================== MAIN ===================== -->
<div class="app-shell">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19 19l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="search" id="searchInput" class="search-input" placeholder="Rechercher un jeu, une catégorie, un mode…" autocomplete="off" aria-label="Recherche">
        <button class="search-clear" id="searchClear" aria-label="Effacer la recherche" hidden>×</button>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="historyBtn" title="Historique de consultation" aria-label="Historique">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 7v5.5l3.5 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 12a8 8 0 1 1 2.4 5.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4 8v4h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="mainContent" class="main-content">
    <div id="pageHeader" class="page-header"></div>
    <div id="filterBar" class="filter-bar" hidden></div>
    <div id="breadcrumb" class="breadcrumb" hidden></div>
    <div id="viewRoot" class="view-root"></div>
    <div id="sentinel" class="sentinel" aria-hidden="true"></div>
  </main>
</div>

<!-- Panneau détail jeu -->
<div class="detail-overlay" id="detailOverlay"></div>
<aside class="detail-panel" id="detailPanel" role="dialog" aria-modal="true" aria-label="Détails du jeu">
  <button class="detail-close" id="detailClose" aria-label="Fermer">×</button>
  <div id="detailContent"></div>
</aside>

<!-- Visionneuse image plein écran -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Fermer l'image">×</button>
  <img id="lightboxImg" src="" alt="">
</div>

<!-- Historique -->
<div class="history-overlay" id="historyOverlay"></div>
<aside class="history-panel" id="historyPanel" aria-label="Historique de consultation">
  <div class="history-head">
    <h3>Historique</h3>
    <button class="icon-btn" id="historyClose" aria-label="Fermer l'historique">×</button>
  </div>
  <div id="historyList" class="history-list"></div>
</aside>

<!-- Toasts -->
<div class="toast-stack" id="toastStack" aria-live="polite"></div>

<!-- Retour en haut -->
<button class="to-top" id="toTop" aria-label="Retour en haut" hidden>
  <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 19V6M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>

<!-- Aide raccourcis -->
<div class="shortcuts-overlay" id="shortcutsOverlay"></div>
<div class="shortcuts-modal" id="shortcutsModal" role="dialog" aria-label="Raccourcis clavier">
  <h3>Raccourcis clavier</h3>
  <ul>
    <li><kbd>/</kbd> Rechercher</li>
    <li><kbd>Échap</kbd> Fermer les panneaux</li>
    <li><kbd>1-7</kbd> Naviguer entre les sections</li>
    <li><kbd>↑</kbd> Retour en haut</li>
    <li><kbd>?</kbd> Afficher cette aide</li>
  </ul>
  <button class="btn-primary" id="shortcutsCloseBtn">Compris</button>
</div>

<template id="cardTemplate">
  <article class="game-card" tabindex="0">
    <div class="game-card-media">
      <img loading="lazy" alt="" class="game-card-img">
      <div class="game-card-skel"></div>
      <span class="badge badge-new" hidden>Nouveau</span>
      <span class="badge badge-mode"></span>
      <button class="fav-btn" aria-label="Ajouter aux favoris">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 20.2s-7.6-4.6-9.9-9C.6 7.9 2.2 4.5 5.4 4c2.1-.3 4 .8 5.1 2.6.4.7.5.7.9 0C12.5 4.8 14.4 3.7 16.5 4c3.2.5 4.8 3.9 3.3 7.2-2.3 4.4-9.9 9-9.9 9Z"/></svg>
      </button>
    </div>
    <div class="game-card-body">
      <h3 class="game-card-title"></h3>
      <div class="game-card-meta">
        <span class="game-card-time"></span>
      </div>
    </div>
  </article>
</template>

<script src="js/utils.js"></script>
<script src="js/games.js"></script>
<script src="js/favorites.js"></script>
<script src="js/settings.js"></script>
<script src="js/search.js"></script>
<script src="js/filters.js"></script>
<script src="js/router.js"></script>
<script src="js/app.js"></script>
</body>
</html>
